name: Manage MJR Newsletter

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What do you want to do?"
        required: true
        type: choice
        default: publish_manager
        options:
          - publish_manager
          - publish
          - refresh
          - include
          - exclude
          - up
          - down
          - deselect_all
          - select_all
      payload:
        description: "For publish_manager: paste the Publish Data copied by the Newsletter Manager"
        required: false
        type: string
      item:
        description: "Legacy controls only: exact headline or URL"
        required: false
        type: string

concurrency:
  group: mjr-newsletter-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow

      - name: Apply Newsletter Manager selections
        if: ${{ inputs.action == 'publish_manager' }}
        env:
          MJR_PAYLOAD: ${{ inputs.payload }}
        run: python publish_manager.py --payload "$MJR_PAYLOAD"

      - name: Legacy manager action
        if: ${{ inputs.action != 'publish_manager' }}
        run: python newsletter_manager.py "${{ inputs.action }}" --item "${{ inputs.item }}"

      - name: Build published feed
        if: ${{ inputs.action == 'publish_manager' || inputs.action == 'publish' }}
        run: python generate_feed.py

      - name: Mark manual edition date
        if: ${{ inputs.action == 'publish_manager' || inputs.action == 'publish' }}
        run: python publish_state.py manual

      - name: Save changes
        run: |
          git config user.name "MJR Newsletter Manager"
          git config user.email "actions@users.noreply.github.com"
          git add newsletter-selection.json available-items.json morning-brief.xml email-images/ email-images-manifest.json last-manual-publish.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Newsletter: ${{ inputs.action }}"
            git push
          fi
