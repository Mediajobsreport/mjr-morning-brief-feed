name: Refresh MJR Newsletter Editorial Pool

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

concurrency:
  group: mjr-newsletter-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Verify Pillow
        run: |
          python -c "from PIL import Image, ImageOps; print('Pillow installed successfully')"

      - name: Generate Morning Brief feed
        run: python refresh_available.py

      - name: Commit updated feed and email images
        run: |
          git config user.name "MJR Feed Bot"
          git config user.email "actions@users.noreply.github.com"

          git add available-items.json

          if git diff --cached --quiet; then
            echo "No editorial-pool changes to commit."
          else
            git commit -m "Refresh newsletter editorial pool"
            git push
          fi
