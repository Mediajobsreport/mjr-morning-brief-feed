name: Automatic MJR Morning Brief Fallback

on:
  workflow_dispatch:
  schedule:
    # Multiple off-hour attempts before the 7 a.m. Eastern email.
    # The guard publishes only once per Eastern date and preserves manual editions.
    - cron: "17,47 9-11 * * 1-5"

concurrency:
  group: mjr-newsletter-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - name: Check whether today's edition already exists
        id: guard
        run: python publish_state.py check
      - name: Build automatic edition from regular RSS
        if: steps.guard.outputs.published != 'true'
        run: python generate_feed.py --automatic
      - name: Mark automatic edition date
        if: steps.guard.outputs.published != 'true'
        run: python publish_state.py automatic
      - name: Save automatic edition
        if: steps.guard.outputs.published != 'true'
        run: |
          git config user.name "MJR Feed Bot"
          git config user.email "actions@users.noreply.github.com"
          git add morning-brief.xml available-items.json email-images-manifest.json email-images/ last-automatic-publish.json
          if git diff --cached --quiet; then
            echo "No automatic-edition changes to save."
          else
            git commit -m "Publish automatic Morning Brief fallback"
            git push
          fi
