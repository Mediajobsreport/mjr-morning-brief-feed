name: Automatic MJR Morning Brief Fallback

on:
  workflow_dispatch:
  schedule:
    # 10:30 UTC = 6:30 a.m. EDT / 5:30 a.m. EST.
    # The script itself guards against replacing a manual edition from today.
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

jobs:
  fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - name: Check whether today's manual edition already exists
        id: guard
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          path="last-manual-publish.json"
          today=datetime.now(ZoneInfo("America/New_York")).date().isoformat()
          manual=False
          if os.path.exists(path):
              try:
                  manual=json.load(open(path,encoding="utf-8")).get("date")==today
              except Exception:
                  pass
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("manual="+("true" if manual else "false")+"\n")
          print("Manual edition already published today:",manual)
          PY
      - name: Build automatic edition from regular RSS
        if: steps.guard.outputs.manual != 'true'
        run: python generate_feed.py --automatic
      - name: Save automatic edition
        if: steps.guard.outputs.manual != 'true'
        run: |
          git config user.name "MJR Feed Bot"
          git config user.email "actions@users.noreply.github.com"
          git add morning-brief.xml available-items.json email-images-manifest.json email-images/
          if git diff --cached --quiet; then
            echo "No automatic-edition changes to save."
          else
            git commit -m "Publish automatic Morning Brief fallback"
            git push
          fi
